# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: test-coverage.yaml

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Test coverage
        env:
          # The floor, not the target. Raise it when the package clears the next
          # whole number and stays there; lowering it needs a reason in the
          # commit message.
          COVERAGE_FLOOR: 95
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)

          floor <- as.numeric(Sys.getenv("COVERAGE_FLOOR"))
          total <- covr::percent_coverage(cov)
          by_file <- covr::coverage_to_list(cov)$filecoverage
          if (total < floor) {
            cat("\nLowest covered files:\n")
            print(round(sort(by_file)[seq_len(min(5, length(by_file)))], 2))
            stop(sprintf("coverage %.2f%% is below the floor of %.0f%%",
                         total, floor), call. = FALSE)
          }
          cat(sprintf("\ncoverage %.2f%% clears the floor of %.0f%%\n",
                      total, floor))
        shell: Rscript {0}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
